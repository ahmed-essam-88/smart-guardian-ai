name: smart_guardian_ai
description: Smart safety and environmental monitoring platform for Egypt.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-var.ttf
